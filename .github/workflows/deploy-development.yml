name: Deploy-Development

on:
  workflow_dispatch:
  pull_request:
    branches: ['develop']
    types: ['closed']

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: DEPLOY_DEV

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup .env
        env:
          GENERAL_INQUIRY_URL: ${{ vars.VITE_GENERAL_INQUIRY_URL }}
          TEMPLATE_REQUEST_URL: ${{ vars.VITE_TEMPLATE_REQUEST_URL }}
          PARTNERSHIP_INQUIRY_URL: ${{ vars.VITE_PARTNERSHIP_INQUIRY_URL }}
        run: |
          echo "${{ vars.ENV }}" > .env
          echo "${{ secrets.ENV }}" >> .env
          if [ -n "$GENERAL_INQUIRY_URL" ]; then printf 'VITE_GENERAL_INQUIRY_URL=%s\n' "$GENERAL_INQUIRY_URL" >> .env; fi
          if [ -n "$TEMPLATE_REQUEST_URL" ]; then printf 'VITE_TEMPLATE_REQUEST_URL=%s\n' "$TEMPLATE_REQUEST_URL" >> .env; fi
          if [ -n "$PARTNERSHIP_INQUIRY_URL" ]; then printf 'VITE_PARTNERSHIP_INQUIRY_URL=%s\n' "$PARTNERSHIP_INQUIRY_URL" >> .env; fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Development
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_DEV_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_DEV_SECRET_ACCESS_KEY}}
          aws-region: ap-northeast-2

      - name: Deploy to AWS S3
        env:
          BUCKET_NAME: ${{secrets.AWS_DEV_BUCKET_NAME}}
          aws-access-key-id: ${{secrets.AWS_DEV_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_DEV_SECRET_ACCESS_KEY}}
        run: aws s3 sync ./dist s3://$BUCKET_NAME --delete

      - name: Invalidate AWS Cloudfront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{secrets.AWS_DEV_CLOUDFRONT_ID}} --paths "/*"
